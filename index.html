<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D - Ultimate Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #05070a; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }

        /* HUD Overlay */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 25px; z-index: 10;
        }
        .stats-bar {
            display: flex; justify-content: space-between; width: 100%;
            color: #FFF; font-size: 28px; font-weight: 900;
            text-shadow: 0 3px 6px rgba(0,0,0,0.9);
        }
        .coin-val { color: #FFD700; }
        .jetpack-status {
            color: #00E5FF; font-size: 20px; font-weight: bold; margin-top: 5px; opacity: 0; transition: opacity 0.3s;
        }
        .jetpack-status.active { opacity: 1; }

        /* Menu Overlays */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 10, 0.9); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 30; opacity: 1; transition: opacity 0.4s ease;
        }
        .overlay-screen.hidden { opacity: 0; pointer-events: none; }

        h1.title {
            font-size: 64px; font-weight: 900; font-style: italic;
            background: linear-gradient(45deg, #FF4757, #FFA500, #FFD700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 15px; text-transform: uppercase; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .btn {
            padding: 16px 50px; font-size: 24px; font-weight: 800;
            background: linear-gradient(135deg, #2ED573, #1E90FF); color: white;
            border: none; border-radius: 35px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
            transition: transform 0.15s, box-shadow 0.15s; margin: 10px;
        }
        .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 10px 25px rgba(46, 213, 115, 0.6); }

        .shop-container { display: flex; gap: 20px; margin: 25px 0; }
        .shop-card {
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255,255,255,0.15);
            border-radius: 15px; padding: 20px; width: 160px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
        }
        .shop-card.selected { border-color: #2ED573; background: rgba(46, 213, 115, 0.15); }
        .skin-preview { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #FFF; }

        /* Mobile Controls */
        #touch-controls {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: repeat(3, 65px); grid-template-rows: repeat(2, 65px);
            gap: 12px; pointer-events: auto; z-index: 10;
        }
        .t-btn {
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255,255,255,0.8);
            color: #FFF; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; border-radius: 50%; touch-action: manipulation;
        }
        .t-btn:active { background: rgba(255, 255, 255, 0.5); }
        #t-up { grid-column: 2; grid-row: 1; }
        #t-left { grid-column: 1; grid-row: 2; }
        #t-down { grid-column: 2; grid-row: 2; }
        #t-right { grid-column: 3; grid-row: 2; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="stats-bar">
            <div>SCORE: <span id="score">0</span></div>
            <div class="coin-val">🪙 <span id="coins">0</span></div>
        </div>
        <div class="jetpack-status" id="jetpack-ui">🚀 JETPACK ACTIVE!</div>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="overlay-screen">
        <h1 class="title">SUBWAY RUNNER</h1>
        <p style="margin-bottom: 15px; font-size: 18px; color: #aaa;">Use ARROW KEYS to play!</p>
        
        <div class="shop-container">
            <div class="shop-card selected" id="skin-0" onclick="selectSkin(0)">
                <div class="skin-preview" style="background: #FF4757;"></div>
                <div style="font-weight: bold;">Red Runner</div>
                <div style="font-size: 13px; color: #2ED573;">EQUIPPED</div>
            </div>
            <div class="shop-card" id="skin-1" onclick="selectSkin(1)">
                <div class="skin-preview" style="background: #00E5FF;"></div>
                <div style="font-weight: bold;">Cyber Neon</div>
                <div style="font-size: 13px; color: #FFD700;" id="skin-1-cost">50 Coins</div>
            </div>
            <div class="shop-card" id="skin-2" onclick="selectSkin(2)">
                <div class="skin-preview" style="background: #FFD700;"></div>
                <div style="font-weight: bold;">Gold Legend</div>
                <div style="font-size: 13px; color: #FFD700;" id="skin-2-cost">150 Coins</div>
            </div>
        </div>

        <button class="btn" onclick="startGame()">START RUN</button>
    </div>

    <!-- GAME OVER -->
    <div id="game-over" class="overlay-screen hidden">
        <h1 class="title" style="background: linear-gradient(45deg, #FF4757, #FF6B81);">BUSTED!</h1>
        <p style="font-size: 22px; margin-bottom: 20px;">Score: <span id="final-score">0</span> | Coins: <span id="final-coins">0</span></p>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        <button class="btn" style="background: #57606F;" onclick="openMenu()">MAIN MENU</button>
    </div>

    <div id="touch-controls">
        <div class="t-btn" id="t-up">▲</div>
        <div class="t-btn" id="t-left">◄</div>
        <div class="t-btn" id="t-down">▼</div>
        <div class="t-btn" id="t-right">►</div>
    </div>

    <script>
        // --- AUDIO SYSTEM ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            if (type === 'argh') {
                // Synthesized Inspector "ARGH!" Voice Effect
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(70, now + 0.35);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === 'coin') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(987, now); osc.frequency.setValueAtTime(1318, now + 0.08);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'jump') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'crash') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now); osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- GAME STATE ---
        const LANES = [-3.5, 0, 3.5];
        let currentLane = 1;
        let targetX = LANES[currentLane];
        let score = 0, coins = 0;
        let gameSpeed = 0.45;
        let isPlaying = false, isGameOver = false;
        let isJumping = false, isSliding = false, isFlying = false;
        let yVelocity = 0;
        const gravity = -0.018;
        let flightTimer = 0;
        let currentGroundY = 0;

        // Skins System
        const SKINS = [
            { id: 0, color: 0xFF4757, cost: 0, unlocked: true },
            { id: 1, color: 0x00E5FF, cost: 50, unlocked: false },
            { id: 2, color: 0xFFD700, cost: 150, unlocked: false }
        ];
        let activeSkinIndex = 0;

        // --- THREE.JS ENGINE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e17);
        scene.fog = new THREE.FogExp2(0x0a0e17, 0.01);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, 10);
        camera.rotation.x = -0.22;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- DETAILED SCENERY WORLD GENERATION ---
        const trackGroup = new THREE.Group();
        scene.add(trackGroup);

        function createHouse(side) {
            const house = new THREE.Group();
            const width = 6 + Math.random() * 4;
            const height = 8 + Math.random() * 6;
            const depth = 8 + Math.random() * 4;
            
            // House Base
            const bodyMat = new THREE.MeshLambertMaterial({ color: [0xe74c3c, 0x3498db, 0xf1c40f, 0x9b59b6, 0x34495e][Math.floor(Math.random()*5)] });
            const body = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), bodyMat);
            body.position.y = height / 2;
            house.add(body);

            // Windows with Glowing Lights
            for (let y = 2; y < height - 2; y += 3) {
                for (let z = -depth/3; z <= depth/3; z += 3) {
                    const winMat = new THREE.MeshBasicMaterial({ color: Math.random() > 0.3 ? 0xffea00 : 0x222222 });
                    const win = new THREE.Mesh(new THREE.BoxGeometry(side === 'left' ? 0.1 : 0.1, 1.2, 1.2), winMat);
                    win.position.set(side === 'left' ? width/2 + 0.05 : -width/2 - 0.05, y, z);
                    house.add(win);
                }
            }
            return house;
        }

        function createTrackSegment(zPos) {
            const seg = new THREE.Group();
            seg.position.z = zPos;

            // Ground Track Bed
            const ground = new THREE.Mesh(new THREE.BoxGeometry(14, 0.2, 50), new THREE.MeshLambertMaterial({ color: 0x1e272e }));
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            seg.add(ground);

            // Rails & Ties
            LANES.forEach(x => {
                for (let i = -20; i < 20; i += 4) {
                    const plank = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x3d2314 }));
                    plank.position.set(x, 0.05, i);
                    seg.add(plank);
                }
                [-0.8, 0.8].forEach(ro => {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 50), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8 }));
                    rail.position.set(x + ro, 0.15, 0);
                    seg.add(rail);
                });
            });

            // Houses & Streetlights Scenery on Left/Right
            for (let i = -20; i <= 20; i += 25) {
                const houseL = createHouse('left'); houseL.position.set(-14, 0, i); seg.add(houseL);
                const houseR = createHouse('right'); houseR.position.set(14, 0, i); seg.add(houseR);

                // Streetlights with Cone Light Visual
                [-8.5, 8.5].forEach(x => {
                    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7), new THREE.MeshLambertMaterial({ color: 0x718093 }));
                    pole.position.set(x, 3.5, i);
                    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
                    lamp.position.set(x, 7, i);
                    seg.add(pole); seg.add(lamp);
                });
            }

            trackGroup.add(seg);
            return seg;
        }

        const segments = [createTrackSegment(0), createTrackSegment(-50), createTrackSegment(-100), createTrackSegment(-150)];

        // --- PLAYER CHARACTER ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const bodyMat = new THREE.MeshLambertMaterial({ color: SKINS[0].color });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat);
        body.position.y = 1.1; body.castShadow = true;
        playerGroup.add(body);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
        head.position.y = 1.95; head.castShadow = true;
        playerGroup.add(head);

        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.15, 0.7), new THREE.MeshLambertMaterial({ color: 0x1e90ff }));
        cap.position.set(0, 2.25, -0.05); playerGroup.add(cap);

        const board = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.1, 1.8), new THREE.MeshLambertMaterial({ color: 0xffa500 }));
        board.position.y = 0.2; board.castShadow = true; playerGroup.add(board);

        // Jetpack
        const jetpackGroup = new THREE.Group();
        const pack1 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.8), new THREE.MeshLambertMaterial({ color: 0x70a1ff }));
        pack1.position.set(-0.25, 1.2, -0.35); const pack2 = pack1.clone(); pack2.position.x = 0.25;
        jetpackGroup.add(pack1); jetpackGroup.add(pack2); playerGroup.add(jetpackGroup);
        jetpackGroup.visible = false;

        const playerBB = new THREE.Box3();

        // --- COP & DOG CHARACTER ---
        const copGroup = new THREE.Group();
        const copBody = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.3, 0.6), new THREE.MeshLambertMaterial({ color: 0x1e3799 })); // Uniform
        copBody.position.y = 1.15; copGroup.add(copBody);
        const copHead = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
        copHead.position.y = 2.0; copGroup.add(copHead);
        const copCap = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.7), new THREE.MeshLambertMaterial({ color: 0x0a3d62 }));
        copCap.position.set(0, 2.3, 0); copGroup.add(copCap);

        // Dog Mesh
        const dog = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.9), new THREE.MeshLambertMaterial({ color: 0x78e08f }));
        dog.position.set(0.8, 0.35, -0.3); copGroup.add(dog);
        scene.add(copGroup);

        // --- HIGH-DETAIL TRAIN GENERATOR ---
        function createDetailedTrain(lengthType) {
            const trainGroup = new THREE.Group();
            const trainLength = lengthType === 'long' ? 18 : 11;
            const isPassenger = Math.random() > 0.4;

            // Train Main Body
            const bodyColor = isPassenger ? 0x27ae60 : 0x2980b9;
            const bodyGeo = new THREE.BoxGeometry(2.7, 3.3, trainLength);
            const trainBody = new THREE.Mesh(bodyGeo, new THREE.MeshLambertMaterial({ color: bodyColor }));
            trainBody.position.y = 1.7; trainBody.castShadow = true;
            trainGroup.add(trainBody);

            // Roof Vents / Details
            for (let z = -trainLength/2 + 2; z < trainLength/2 - 2; z += 4) {
                const vent = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2), new THREE.MeshLambertMaterial({ color: 0x7f8c8d }));
                vent.position.set(0, 3.45, z);
                trainGroup.add(vent);
            }

            // Headlights
            const light1 = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0xFFFEE0 }));
            light1.position.set(-0.8, 2.2, trainLength/2 + 0.05);
            const light2 = light1.clone(); light2.position.x = 0.8;
            trainGroup.add(light1); trainGroup.add(light2);

            // Windows & Passenger Car details
            if (isPassenger) {
                for (let z = -trainLength/2 + 1.5; z < trainLength/2 - 1.5; z += 2.5) {
                    [-1.36, 1.36].forEach(x => {
                        const win = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.0, 1.4), new THREE.MeshBasicMaterial({ color: 0xFFEA00 }));
                        win.position.set(x, 2.1, z);
                        trainGroup.add(win);
                    });
                }
            }

            // Wheels Assembly
            for (let z = -trainLength/2 + 2; z <= trainLength/2 - 2; z += trainLength - 4) {
                [-1.1, 1.1].forEach(x => {
                    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 }));
                    wheel.rotation.z = Math.PI / 2;
                    wheel.position.set(x, 0.4, z);
                    trainGroup.add(wheel);
                });
            }

            return { mesh: trainGroup, length: trainLength };
        }

        // --- OBSTACLES & POWERUPS SYSTEM ---
        const obstacles = [];
        const coinsList = [];
        const powerups = [];

        function spawnObstacleCluster(zPos) {
            const lane = Math.floor(Math.random() * 3);
            const x = LANES[lane];
            const rand = Math.random();

            if (rand < 0.5) {
                // Moving Detailed Trains
                const trainObj = createDetailedTrain(Math.random() > 0.5 ? 'long' : 'short');
                const trainMesh = trainObj.mesh;
                trainMesh.position.set(x, 0, zPos);
                scene.add(trainMesh);
                trainMesh.userData = { type: 'train', speed: 0.15, length: trainObj.length };
                obstacles.push(trainMesh);

            } else if (rand < 0.75) {
                // High Hurdle (Duck under!)
                const barGroup = new THREE.Group(); barGroup.position.set(x, 0, zPos);
                const bar = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.4, 0.4), new THREE.MeshLambertMaterial({ color: 0xffa500 }));
                bar.position.y = 1.3;
                const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.3, 0.2), new THREE.MeshLambertMaterial({ color: 0x57606f }));
                leg1.position.set(-1.3, 0.65, 0); const leg2 = leg1.clone(); leg2.position.x = 1.3;
                barGroup.add(bar); barGroup.add(leg1); barGroup.add(leg2);
                scene.add(barGroup);
                barGroup.userData = { type: 'high_hurdle' };
                obstacles.push(barGroup);
            } else {
                // Low Hurdle (Jump over!)
                const hurdle = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.8, 0.4), new THREE.MeshLambertMaterial({ color: 0xff4757 }));
                hurdle.position.set(x, 0.4, zPos);
                scene.add(hurdle);
                hurdle.userData = { type: 'low_hurdle' };
                obstacles.push(hurdle);
            }

            // Spawn Jetpack Power-up
            if (Math.random() < 0.12) {
                const jp = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x00E5FF, emissive: 0x00A3FF }));
                jp.position.set(LANES[(lane + 1) % 3], 1.2, zPos);
                scene.add(jp);
                powerups.push(jp);
            }

            // Spawn Coins
            for (let l = 0; l < 3; l++) {
                if (l !== lane && Math.random() < 0.7) {
                    for (let c = 0; c < 4; c++) {
                        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
                        const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16), coinMat);
                        coin.rotation.x = Math.PI / 2;
                        coin.position.set(LANES[l], 1.0, zPos - (c * 2.2));
                        scene.add(coin);
                        coinsList.push(coin);
                    }
                }
            }
        }

        // --- SHOP & SKINS ---
        function selectSkin(index) {
            const skin = SKINS[index];
            if (!skin.unlocked) {
                if (coins >= skin.cost) {
                    coins -= skin.cost; skin.unlocked = true;
                    document.getElementById('coins').innerText = coins;
                    document.getElementById(`skin-${index}-cost`).innerText = 'UNLOCKED';
                    document.getElementById(`skin-${index}-cost`).style.color = '#2ED573';
                } else { alert("Not enough coins!"); return; }
            }
            activeSkinIndex = index;
            bodyMat.color.setHex(skin.color);
            document.querySelectorAll('.shop-card').forEach((card, i) => card.classList.toggle('selected', i === index));
        }

        // --- STRICT ARROW CONTROLS ---
        function moveLeft() { if (currentLane > 0 && isPlaying) { currentLane--; targetX = LANES[currentLane]; } }
        function moveRight() { if (currentLane < 2 && isPlaying) { currentLane++; targetX = LANES[currentLane]; } }
        function jump() {
            if (!isJumping && isPlaying && !isFlying) {
                initAudio(); isJumping = true; yVelocity = 0.36; playSound('jump');
            }
        }
        function slide() {
            if (!isSliding && isPlaying && !isFlying) {
                initAudio(); isSliding = true;
                playerGroup.scale.set(1, 0.4, 1);
                setTimeout(() => { playerGroup.scale.set(1, 1, 1); isSliding = false; }, 750);
            }
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'ArrowLeft') moveLeft();
            if (e.code === 'ArrowRight') moveRight();
            if (e.code === 'ArrowUp') jump();
            if (e.code === 'ArrowDown') slide();
        });

        document.getElementById('t-left').onclick = moveLeft;
        document.getElementById('t-right').onclick = moveRight;
        document.getElementById('t-up').onclick = jump;
        document.getElementById('t-down').onclick = slide;

        // --- GAME LOGIC & FLOW ---
        function openMenu() {
            isPlaying = false;
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function startGame() {
            initAudio();
            playSound('argh'); // ICONIC INSPECTOR "ARGH!" SOUND
            
            score = 0; gameSpeed = 0.45; currentLane = 1; targetX = LANES[1];
            isGameOver = false; isPlaying = true; isFlying = false; flightTimer = 0;
            currentGroundY = 0; playerGroup.position.set(0, 0, 0);

            document.getElementById('score').innerText = '0';
            document.getElementById('coins').innerText = coins;
            document.getElementById('jetpack-ui').classList.remove('active');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');

            // Clear Scene
            obstacles.forEach(o => scene.remove(o));
            coinsList.forEach(c => scene.remove(c));
            powerups.forEach(p => scene.remove(p));
            obstacles.length = 0; coinsList.length = 0; powerups.length = 0;

            for (let z = -30; z > -160; z -= 30) spawnObstacleCluster(z);
        }

        function triggerGameOver() {
            isGameOver = true; isPlaying = false;
            playSound('crash');
            document.getElementById('final-score').innerText = Math.floor(score / 5);
            document.getElementById('final-coins').innerText = coins;
            document.getElementById('game-over').classList.remove('hidden');
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isPlaying) {
                camera.position.x = Math.sin(Date.now() * 0.001) * 1.5;
                renderer.render(scene, camera);
                return;
            }

            score += 1;
            gameSpeed += 0.00004;
            document.getElementById('score').innerText = Math.floor(score / 5);

            // Smooth Movement & Rotation
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;
            playerGroup.rotation.z = (playerGroup.position.x - targetX) * 0.08;

            // Cop & Dog Chasing Behind Player
            copGroup.position.x += (playerGroup.position.x - copGroup.position.x) * 0.1;
            copGroup.position.z = playerGroup.position.z + 2.8;
            copGroup.position.y = playerGroup.position.y;

            // Jetpack Logic
            if (isFlying) {
                flightTimer--;
                playerGroup.position.y += (7.0 - playerGroup.position.y) * 0.1;
                if (flightTimer <= 0) {
                    isFlying = false; jetpackGroup.visible = false;
                    document.getElementById('jetpack-ui').classList.remove('active');
                }
            } else {
                if (isJumping) {
                    playerGroup.position.y += yVelocity; yVelocity += gravity;
                    if (playerGroup.position.y <= currentGroundY) {
                        playerGroup.position.y = currentGroundY; isJumping = false;
                    }
                } else {
                    playerGroup.position.y += (currentGroundY - playerGroup.position.y) * 0.2;
                }
            }

            // Scroll Tracks & Buildings
            segments.forEach(seg => {
                seg.position.z += gameSpeed;
                if (seg.position.z > 50) seg.position.z -= 200;
            });

            playerBB.setFromObject(playerGroup);
            let detectedRoofY = 0;

            // Process Oncoming Trains & Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                const type = obs.userData.type;

                if (type === 'train') obs.position.z += gameSpeed + obs.userData.speed;
                else obs.position.z += gameSpeed;

                const obsBB = new THREE.Box3().setFromObject(obs);

                // Train Surfing Detection
                if (type === 'train') {
                    const halfLen = obs.userData.length / 2;
                    if (Math.abs(playerGroup.position.x - obs.position.x) < 1.2 && 
                        playerGroup.position.z > (obs.position.z - halfLen) && 
                        playerGroup.position.z < (obs.position.z + halfLen)) {
                        if (playerGroup.position.y >= 3.0) detectedRoofY = 3.3;
                    }
                }

                // Collisions
                if (playerBB.intersectsBox(obsBB) && !isFlying) {
                    if (type === 'high_hurdle' && isSliding) {} 
                    else if (type === 'train' && playerGroup.position.y >= 3.1) {} 
                    else { triggerGameOver(); }
                }

                if (obs.position.z > 20) {
                    scene.remove(obs); obstacles.splice(i, 1); spawnObstacleCluster(-150);
                }
            }

            currentGroundY = detectedRoofY;

            // Collect Power-ups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const jp = powerups[i]; jp.position.z += gameSpeed; jp.rotation.y += 0.04;
                if (playerBB.intersectsBox(new THREE.Box3().setFromObject(jp))) {
                    isFlying = true; flightTimer = 350; jetpackGroup.visible = true;
                    playSound('jump'); document.getElementById('jetpack-ui').classList.add('active');
                    scene.remove(jp); powerups.splice(i, 1); continue;
                }
                if (jp.position.z > 20) { scene.remove(jp); powerups.splice(i, 1); }
            }

            // Collect Coins
            for (let i = coinsList.length - 1; i >= 0; i--) {
                const coin = coinsList[i]; coin.position.z += gameSpeed; coin.rotation.z += 0.05;
                if (playerBB.intersectsBox(new THREE.Box3().setFromObject(coin))) {
                    coins++; playSound('coin'); document.getElementById('coins').innerText = coins;
                    scene.remove(coin); coinsList.splice(i, 1); continue;
                }
                if (coin.position.z > 20) { scene.remove(coin); coinsList.splice(i, 1); }
            }

            // Dynamic Camera Setup
            camera.position.x = playerGroup.position.x * 0.3;
            camera.position.y = 5 + (playerGroup.position.y * 0.4);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
