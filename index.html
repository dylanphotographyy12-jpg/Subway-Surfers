<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers 3D - Deluxe Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0b0e14; font-family: 'Segoe UI', Roboto, sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }

        /* UI Overlay */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 25px; z-index: 10;
        }
        .stats-bar {
            display: flex; justify-content: space-between; width: 100%;
            color: #FFF; font-size: 26px; font-weight: 900;
            text-shadow: 0 3px 6px rgba(0,0,0,0.9);
        }
        .coin-val { color: #FFD700; }
        .jetpack-status {
            color: #00E5FF; font-size: 18px; margin-top: 5px; opacity: 0; transition: opacity 0.3s;
        }
        .jetpack-status.active { opacity: 1; }

        /* Main Menu & Shop Overlay */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 14, 20, 0.88); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 30; opacity: 1; transition: opacity 0.4s ease;
        }
        .overlay-screen.hidden { opacity: 0; pointer-events: none; }

        h1.title {
            font-size: 64px; font-weight: 900; font-style: italic;
            background: linear-gradient(45deg, #FF4757, #FFA500, #FFD700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 20px; text-transform: uppercase; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .btn {
            padding: 15px 45px; font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, #2ED573, #1E90FF); color: white;
            border: none; border-radius: 35px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(46, 213, 115, 0.4);
            transition: transform 0.15s, box-shadow 0.15s; margin: 10px;
        }
        .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 25px rgba(46, 213, 115, 0.6); }

        /* Shop Grid */
        .shop-container {
            display: flex; gap: 20px; margin: 25px 0;
        }
        .shop-card {
            background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255,255,255,0.15);
            border-radius: 15px; padding: 20px; width: 160px; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .shop-card.selected { border-color: #2ED573; background: rgba(46, 213, 115, 0.15); }
        .skin-preview { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #FFF; }

        /* Controls UI */
        #touch-controls {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: repeat(3, 65px); grid-template-rows: repeat(2, 65px);
            gap: 12px; pointer-events: auto; z-index: 10;
        }
        .t-btn {
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255,255,255,0.8);
            color: #FFF; display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; border-radius: 50%; touch-action: manipulation;
        }
        .t-btn:active { background: rgba(255, 255, 255, 0.5); }
        #t-up { grid-column: 2; grid-row: 1; }
        #t-left { grid-column: 1; grid-row: 2; }
        #t-down { grid-column: 2; grid-row: 2; }
        #t-right { grid-column: 3; grid-row: 2; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="stats-bar">
            <div>SCORE: <span id="score">0</span></div>
            <div class="coin-val">🪙 <span id="coins">0</span></div>
        </div>
        <div class="jetpack-status" id="jetpack-ui">🚀 JETPACK ACTIVE!</div>
    </div>

    <!-- MAIN MENU & LOBBY -->
    <div id="main-menu" class="overlay-screen">
        <h1 class="title">SUBWAY RUNNER</h1>
        <p style="margin-bottom: 15px; font-size: 18px; color: #aaa;">Select Your Skin & Hit Play</p>
        
        <div class="shop-container">
            <div class="shop-card selected" id="skin-0" onclick="selectSkin(0)">
                <div class="skin-preview" style="background: #FF4757;"></div>
                <div style="font-weight: bold;">Red Runner</div>
                <div style="font-size: 13px; color: #2ED573;">EQUIPPED</div>
            </div>
            <div class="shop-card" id="skin-1" onclick="selectSkin(1)">
                <div class="skin-preview" style="background: #00E5FF;"></div>
                <div style="font-weight: bold;">Cyber Neon</div>
                <div style="font-size: 13px; color: #FFD700;" id="skin-1-cost">50 Coins</div>
            </div>
            <div class="shop-card" id="skin-2" onclick="selectSkin(2)">
                <div class="skin-preview" style="background: #FFD700;"></div>
                <div style="font-weight: bold;">Gold Legend</div>
                <div style="font-size: 13px; color: #FFD700;" id="skin-2-cost">150 Coins</div>
            </div>
        </div>

        <button class="btn" onclick="startGame()">START RUN</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over" class="overlay-screen hidden">
        <h1 class="title" style="background: linear-gradient(45deg, #FF4757, #FF6B81);">BUSTED!</h1>
        <p style="font-size: 22px; margin-bottom: 20px;">Score: <span id="final-score">0</span> | Coins: <span id="final-coins">0</span></p>
        <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        <button class="btn" style="background: #57606F;" onclick="openMenu()">MAIN MENU</button>
    </div>

    <div id="touch-controls">
        <div class="t-btn" id="t-up">▲</div>
        <div class="t-btn" id="t-left">◄</div>
        <div class="t-btn" id="t-down">▼</div>
        <div class="t-btn" id="t-right">►</div>
    </div>

    <script>
        // --- AUDIO SYSTEM ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(987, now);
                osc.frequency.setValueAtTime(1318, now + 0.08);
                gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'jump') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'jetpack') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.4);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'crash') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- GAME STATE ---
        const LANES = [-3.5, 0, 3.5];
        let currentLane = 1;
        let targetX = LANES[currentLane];
        let score = 0, coins = 0;
        let gameSpeed = 0.4;
        let isPlaying = false, isGameOver = false;
        let isJumping = false, isSliding = false, isFlying = false;
        let yVelocity = 0;
        const gravity = -0.018;
        let flightTimer = 0;
        let currentGroundY = 0; // Dynamic ground plane (for running on top of trains)

        // Skins System
        const SKINS = [
            { id: 0, color: 0xFF4757, cost: 0, unlocked: true },
            { id: 1, color: 0x00E5FF, cost: 50, unlocked: false },
            { id: 2, color: 0xFFD700, cost: 150, unlocked: false }
        ];
        let activeSkinIndex = 0;

        // --- THREE.JS ENGINE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);
        scene.fog = new THREE.FogExp2(0x0b0e14, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, 10);
        camera.rotation.x = -0.22;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 50, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- ENVIRONMENT & PROCEDURAL WORLD ---
        const trackGroup = new THREE.Group();
        scene.add(trackGroup);

        function createTrackSegment(zPos, hasTunnel = false) {
            const seg = new THREE.Group();
            seg.position.z = zPos;

            // Main Ground Bed
            const gGeo = new THREE.BoxGeometry(14, 0.2, 50);
            const gMat = new THREE.MeshLambertMaterial({ color: 0x222831 });
            const ground = new THREE.Mesh(gGeo, gMat);
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            seg.add(ground);

            // Rails & Wooden Ties
            LANES.forEach(x => {
                for (let i = -20; i < 20; i += 4) {
                    const plank = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.8), new THREE.MeshLambertMaterial({ color: 0x3d2314 }));
                    plank.position.set(x, 0.05, i);
                    seg.add(plank);
                }
                [-0.8, 0.8].forEach(ro => {
                    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 50), new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 }));
                    rail.position.set(x + ro, 0.15, 0);
                    seg.add(rail);
                });
            });

            // Side Walls
            [-7.5, 7.5].forEach(x => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 50), new THREE.MeshLambertMaterial({ color: 0x1e272e }));
                wall.position.set(x, 5, 0);
                seg.add(wall);
            });

            // Tunnel Structure
            if (hasTunnel) {
                const arch = new THREE.Mesh(new THREE.BoxGeometry(16, 2, 20), new THREE.MeshLambertMaterial({ color: 0x11141a }));
                arch.position.set(0, 9, 0);
                seg.add(arch);
                const pillarLeft = new THREE.Mesh(new THREE.BoxGeometry(2, 8, 20), new THREE.MeshLambertMaterial({ color: 0x11141a }));
                pillarLeft.position.set(-7, 4, 0);
                const pillarRight = pillarLeft.clone();
                pillarRight.position.x = 7;
                seg.add(pillarLeft); seg.add(pillarRight);
            }

            trackGroup.add(seg);
            return seg;
        }

        const segments = [
            createTrackSegment(0), createTrackSegment(-50, true),
            createTrackSegment(-100), createTrackSegment(-150, true)
        ];

        // --- PLAYER CHARACTER ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Character Parts
        const bodyMat = new THREE.MeshLambertMaterial({ color: SKINS[0].color });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), bodyMat);
        body.position.y = 1.1; body.castShadow = true;
        playerGroup.add(body);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xffccaa }));
        head.position.y = 1.95; head.castShadow = true;
        playerGroup.add(head);

        const cap = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.15, 0.7), new THREE.MeshLambertMaterial({ color: 0x1e90ff }));
        cap.position.set(0, 2.25, -0.05);
        playerGroup.add(cap);

        const board = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.1, 1.8), new THREE.MeshLambertMaterial({ color: 0xffa500 }));
        board.position.y = 0.2; board.castShadow = true;
        playerGroup.add(board);

        // Jetpack Model (Initially Hidden)
        const jetpackGroup = new THREE.Group();
        const pack1 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.8), new THREE.MeshLambertMaterial({ color: 0x70a1ff }));
        pack1.position.set(-0.25, 1.2, -0.35);
        const pack2 = pack1.clone(); pack2.position.x = 0.25;
        jetpackGroup.add(pack1); jetpackGroup.add(pack2);
        playerGroup.add(jetpackGroup);
        jetpackGroup.visible = false;

        const playerBB = new THREE.Box3();

        // --- DYNAMIC OBSTACLES & POWERUPS ---
        const obstacles = [];
        const coinsList = [];
        const powerups = [];

        function spawnObstacleCluster(zPos) {
            const lane = Math.floor(Math.random() * 3);
            const x = LANES[lane];
            const rand = Math.random();

            if (rand < 0.45) {
                // Oncoming Moving Train
                const trainGroup = new THREE.Group();
                trainGroup.position.set(x, 0, zPos);

                const trainBody = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.2, 12), new THREE.MeshLambertMaterial({ color: 0x1e90ff }));
                trainBody.position.y = 1.6; trainBody.castShadow = true;
                trainGroup.add(trainBody);

                const frontWin = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.0, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
                frontWin.position.set(0, 2.2, 6.01);
                trainGroup.add(frontWin);

                scene.add(trainGroup);
                trainGroup.userData = { type: 'train', speed: 0.15 };
                obstacles.push(trainGroup);

            } else if (rand < 0.7) {
                // High Hurdle (Duck / Slide under!)
                const barGroup = new THREE.Group();
                barGroup.position.set(x, 0, zPos);

                const bar = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.4, 0.4), new THREE.MeshLambertMaterial({ color: 0xffa500 }));
                bar.position.y = 1.3;
                const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.3, 0.2), new THREE.MeshLambertMaterial({ color: 0x57606f }));
                leg1.position.set(-1.3, 0.65, 0);
                const leg2 = leg1.clone(); leg2.position.x = 1.3;

                barGroup.add(bar); barGroup.add(leg1); barGroup.add(leg2);
                scene.add(barGroup);
                barGroup.userData = { type: 'high_hurdle' };
                obstacles.push(barGroup);

            } else {
                // Low Hurdle (Jump over!)
                const hurdle = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.8, 0.4), new THREE.MeshLambertMaterial({ color: 0xff4757 }));
                hurdle.position.set(x, 0.4, zPos);
                scene.add(hurdle);
                hurdle.userData = { type: 'low_hurdle' };
                obstacles.push(hurdle);
            }

            // Power-ups (Jetpack)
            if (Math.random() < 0.12) {
                const jp = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x00E5FF, emissive: 0x00A3FF }));
                jp.position.set(LANES[(lane + 1) % 3], 1.2, zPos);
                scene.add(jp);
                powerups.push(jp);
            }

            // Coins Layout
            for (let l = 0; l < 3; l++) {
                if (l !== lane && Math.random() < 0.7) {
                    for (let c = 0; c < 4; c++) {
                        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
                        const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16), coinMat);
                        coin.rotation.x = Math.PI / 2;
                        coin.position.set(LANES[l], 1.0, zPos - (c * 2.2));
                        scene.add(coin);
                        coinsList.push(coin);
                    }
                }
            }
        }

        // --- SHOP & SKIN SYSTEM ---
        function selectSkin(index) {
            const skin = SKINS[index];
            if (!skin.unlocked) {
                if (coins >= skin.cost) {
                    coins -= skin.cost;
                    skin.unlocked = true;
                    document.getElementById('coins').innerText = coins;
                    document.getElementById(`skin-${index}-cost`).innerText = 'UNLOCKED';
                    document.getElementById(`skin-${index}-cost`).style.color = '#2ED573';
                } else {
                    alert("Not enough coins!");
                    return;
                }
            }
            activeSkinIndex = index;
            bodyMat.color.setHex(skin.color);
            document.querySelectorAll('.shop-card').forEach((card, i) => {
                card.classList.toggle('selected', i === index);
            });
        }

        // --- INPUT & CONTROLS ---
        function moveLeft() { if (currentLane > 0 && isPlaying) { currentLane--; targetX = LANES[currentLane]; } }
        function moveRight() { if (currentLane < 2 && isPlaying) { currentLane++; targetX = LANES[currentLane]; } }
        function jump() {
            if (!isJumping && isPlaying && !isFlying) {
                initAudio(); isJumping = true; yVelocity = 0.36; playSound('jump');
            }
        }
        function slide() {
            if (!isSliding && isPlaying && !isFlying) {
                initAudio(); isSliding = true;
                playerGroup.scale.set(1, 0.4, 1);
                setTimeout(() => { playerGroup.scale.set(1, 1, 1); isSliding = false; }, 750);
            }
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
            if (e.code === 'ArrowUp' || e.code === 'KeyW') jump();
            if (e.code === 'ArrowDown' || e.code === 'KeyS') slide();
        });

        document.getElementById('t-left').onclick = moveLeft;
        document.getElementById('t-right').onclick = moveRight;
        document.getElementById('t-up').onclick = jump;
        document.getElementById('t-down').onclick = slide;

        // --- GAME FLOW LOGIC ---
        function openMenu() {
            isPlaying = false;
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        function startGame() {
            initAudio();
            score = 0; gameSpeed = 0.4; currentLane = 1; targetX = LANES[1];
            isGameOver = false; isPlaying = true; isFlying = false; flightTimer = 0;
            currentGroundY = 0; playerGroup.position.set(0, 0, 0);

            document.getElementById('score').innerText = '0';
            document.getElementById('coins').innerText = coins;
            document.getElementById('jetpack-ui').classList.remove('active');
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');

            // Clear Scene Objects
            obstacles.forEach(o => scene.remove(o));
            coinsList.forEach(c => scene.remove(c));
            powerups.forEach(p => scene.remove(p));
            obstacles.length = 0; coinsList.length = 0; powerups.length = 0;

            for (let z = -30; z > -160; z -= 30) spawnObstacleCluster(z);
        }

        function triggerGameOver() {
            isGameOver = true; isPlaying = false;
            playSound('crash');
            document.getElementById('final-score').innerText = Math.floor(score / 5);
            document.getElementById('final-coins').innerText = coins;
            document.getElementById('game-over').classList.remove('hidden');
        }

        // --- MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isPlaying) {
                // Subtle menu camera hover animation
                camera.position.x = Math.sin(Date.now() * 0.001) * 1.5;
                renderer.render(scene, camera);
                return;
            }

            score += 1;
            gameSpeed += 0.00004;
            document.getElementById('score').innerText = Math.floor(score / 5);

            // Smooth Lateral Lane Switching & Tilt
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.22;
            playerGroup.rotation.z = (playerGroup.position.x - targetX) * 0.08;

            // Jetpack Power-Up Handler
            if (isFlying) {
                flightTimer--;
                playerGroup.position.y += (7.0 - playerGroup.position.y) * 0.1;
                if (flightTimer <= 0) {
                    isFlying = false;
                    jetpackGroup.visible = false;
                    document.getElementById('jetpack-ui').classList.remove('active');
                }
            } else {
                // Physics & Dynamics Ground plane (Train Surfing)
                if (isJumping) {
                    playerGroup.position.y += yVelocity;
                    yVelocity += gravity;
                    if (playerGroup.position.y <= currentGroundY) {
                        playerGroup.position.y = currentGroundY;
                        isJumping = false;
                    }
                } else {
                    // Smooth snap to ground or train roof
                    playerGroup.position.y += (currentGroundY - playerGroup.position.y) * 0.2;
                }
            }

            // Scroll Tracks & Tunnels
            segments.forEach(seg => {
                seg.position.z += gameSpeed;
                if (seg.position.z > 50) seg.position.z -= 200;
            });

            // Update Player Bounding Box
            playerBB.setFromObject(playerGroup);

            // Reset dynamic ground every frame; collision checks will elevate it if on a train
            let detectedRoofY = 0;

            // --- OBSTACLES & TRAINS PROCESSING ---
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                const type = obs.userData.type;

                // Move Oncoming Trains Faster
                if (type === 'train') obs.position.z += gameSpeed + obs.userData.speed;
                else obs.position.z += gameSpeed;

                const obsBB = new THREE.Box3().setFromObject(obs);

                // Check Train Roof Surfing Logic
                if (type === 'train') {
                    const playerX = playerGroup.position.x;
                    const playerZ = playerGroup.position.z;
                    // Check if player is horizontally aligned over train roof
                    if (Math.abs(playerX - obs.position.x) < 1.2 && playerZ > (obs.position.z - 6) && playerZ < (obs.position.z + 6)) {
                        if (playerGroup.position.y >= 3.0) {
                            detectedRoofY = 3.2; // Elevator ground level to Train Roof height
                        }
                    }
                }

                // Hit Detection
                if (playerBB.intersectsBox(obsBB) && !isFlying) {
                    // Ducking exception for High Hurdles
                    if (type === 'high_hurdle' && isSliding) {
                        // Safely ducked under!
                    } 
                    // Train Roof Running Exception
                    else if (type === 'train' && playerGroup.position.y >= 3.1) {
                        // Running on top of train safely!
                    } 
                    else {
                        triggerGameOver();
                    }
                }

                // Recycle Obstacles
                if (obs.position.z > 20) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    spawnObstacleCluster(-150);
                }
            }

            currentGroundY = detectedRoofY;

            // --- POWERUP COLLECTION ---
            for (let i = powerups.length - 1; i >= 0; i--) {
                const jp = powerups[i];
                jp.position.z += gameSpeed;
                jp.rotation.y += 0.04;

                if (playerBB.intersectsBox(new THREE.Box3().setFromObject(jp))) {
                    isFlying = true; flightTimer = 350;
                    jetpackGroup.visible = true;
                    playSound('jetpack');
                    document.getElementById('jetpack-ui').classList.add('active');
                    scene.remove(jp); powerups.splice(i, 1);
                    continue;
                }
                if (jp.position.z > 20) { scene.remove(jp); powerups.splice(i, 1); }
            }

            // --- COIN COLLECTION ---
            for (let i = coinsList.length - 1; i >= 0; i--) {
                const coin = coinsList[i];
                coin.position.z += gameSpeed;
                coin.rotation.z += 0.05;

                if (playerBB.intersectsBox(new THREE.Box3().setFromObject(coin))) {
                    coins++;
                    playSound('coin');
                    document.getElementById('coins').innerText = coins;
                    scene.remove(coin); coinsList.splice(i, 1);
                    continue;
                }
                if (coin.position.z > 20) { scene.remove(coin); coinsList.splice(i, 1); }
            }

            // Camera Tracking
            camera.position.x = playerGroup.position.x * 0.3;
            camera.position.y = 5 + (playerGroup.position.y * 0.4);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
