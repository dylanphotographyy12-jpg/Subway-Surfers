<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Subway Surfers Runner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }

        /* UI Overlay */
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; padding: 20px; z-index: 10;
        }
        #stats {
            display: flex; justify-content: space-between; width: 100%;
            color: #FFF; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .coin-count { color: #FFD700; }

        /* Game Over Screen */
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #game-over.active { opacity: 1; pointer-events: auto; }
        #game-over h1 { font-size: 54px; color: #FF4757; margin-bottom: 10px; text-transform: uppercase; }
        #game-over p { font-size: 20px; margin-bottom: 25px; }
        #restart-btn {
            padding: 12px 30px; font-size: 20px; font-weight: bold;
            background: #2ED573; color: white; border: none; border-radius: 25px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: transform 0.1s, background 0.2s;
        }
        #restart-btn:hover { background: #26AF5F; transform: scale(1.05); }

        /* On-Screen Touch Controls for Mobile/Glasses */
        #touch-controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px);
            gap: 10px; pointer-events: auto; z-index: 10;
        }
        .t-btn {
            background: rgba(255, 255, 255, 0.25); border: 2px solid #FFF; color: #FFF;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: bold; border-radius: 50%; touch-action: manipulation;
        }
        .t-btn:active { background: rgba(255, 255, 255, 0.6); }
        #t-up { grid-column: 2; grid-row: 1; }
        #t-left { grid-column: 1; grid-row: 2; }
        #t-down { grid-column: 2; grid-row: 2; }
        #t-right { grid-column: 3; grid-row: 2; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div id="stats">
            <div>SCORE: <span id="score">0</span></div>
            <div class="coin-count">🪙 <span id="coins">0</span></div>
        </div>
    </div>

    <div id="game-over">
        <h1>Busted!</h1>
        <p>Final Score: <span id="final-score">0</span> | Coins: <span id="final-coins">0</span></p>
        <button id="restart-btn">PLAY AGAIN</button>
    </div>

    <div id="touch-controls">
        <div class="t-btn" id="t-up">▲</div>
        <div class="t-btn" id="t-left">◄</div>
        <div class="t-btn" id="t-down">▼</div>
        <div class="t-btn" id="t-right">►</div>
    </div>

    <script>
        // --- 1. WEBAUDIO SOUND SYSTEM ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'jump') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- 2. GAME CONSTANTS & STATE ---
        const LANES = [-3.5, 0, 3.5];
        let currentLane = 1; // 0: Left, 1: Center, 2: Right
        let targetX = LANES[currentLane];
        let score = 0, coins = 0;
        let gameSpeed = 0.4;
        let isGameOver = false;
        let isJumping = false, isSliding = false;
        let yVelocity = 0;
        const gravity = -0.018;

        // --- 3. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e272e);
        scene.fog = new THREE.FogExp2(0x1e272e, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, 10);
        camera.rotation.x = -0.25;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- 4. PROCEDURAL TRACK & ENVIRONMENT ---
        const trackGroup = new THREE.Group();
        scene.add(trackGroup);

        function createTrackSegment(zPos) {
            const segment = new THREE.Group();
            segment.position.z = zPos;

            // Ground Track Bed
            const groundGeo = new THREE.BoxGeometry(14, 0.2, 50);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.position.y = -0.1;
            ground.receiveShadow = true;
            segment.add(ground);

            // Rails & Planks for 3 Lanes
            LANES.forEach(x => {
                // Planks
                for (let i = -20; i < 20; i += 4) {
                    const plankGeo = new THREE.BoxGeometry(2.2, 0.1, 0.8);
                    const plankMat = new THREE.MeshLambertMaterial({ color: 0x5c3e28 });
                    const plank = new THREE.Mesh(plankGeo, plankMat);
                    plank.position.set(x, 0.05, i);
                    segment.add(plank);
                }
                // Steel Rails
                [-0.8, 0.8].forEach(railOffset => {
                    const railGeo = new THREE.BoxGeometry(0.15, 0.2, 50);
                    const railMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });
                    const rail = new THREE.Mesh(railGeo, railMat);
                    rail.position.set(x + railOffset, 0.15, 0);
                    segment.add(rail);
                });
            });

            // Side Walls
            [-7.5, 7.5].forEach(x => {
                const wallGeo = new THREE.BoxGeometry(1, 8, 50);
                const wallMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(x, 4, 0);
                segment.add(wall);
            });

            trackGroup.add(segment);
            return segment;
        }

        const segments = [createTrackSegment(0), createTrackSegment(-50), createTrackSegment(-100)];

        // --- 5. PLAYER CHARACTER ---
        const playerGroup = new THREE.Group();
        playerGroup.position.set(0, 0, 0);
        scene.add(playerGroup);

        // Body Mesh (Surfer Boy)
        const bodyGeo = new THREE.BoxGeometry(0.8, 1.2, 0.5);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xff4757 }); // Red Hoodie
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 1.1;
        body.castShadow = true;
        playerGroup.add(body);

        // Head
        const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const headMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.95;
        head.castShadow = true;
        playerGroup.add(head);

        // Cap
        const capGeo = new THREE.BoxGeometry(0.55, 0.15, 0.7);
        const capMat = new THREE.MeshLambertMaterial({ color: 0x2ed573 });
        const cap = new THREE.Mesh(capGeo, capMat);
        cap.position.set(0, 2.25, -0.05);
        playerGroup.add(cap);

        // Hoverboard / Skateboard
        const boardGeo = new THREE.BoxGeometry(0.9, 0.1, 1.8);
        const boardMat = new THREE.MeshLambertMaterial({ color: 0xffa500 });
        const board = new THREE.Mesh(boardGeo, boardMat);
        board.position.y = 0.2;
        board.castShadow = true;
        playerGroup.add(board);

        // Player Bounding Box
        const playerBB = new THREE.Box3();

        // --- 6. OBSTACLES & COINS SYSTEM ---
        const obstacles = [];
        const coinsList = [];

        function spawnObstacleCluster(zPos) {
            const lane = Math.floor(Math.random() * 3);
            const x = LANES[lane];
            const type = Math.random();

            if (type < 0.45) {
                // Subway Train
                const trainGeo = new THREE.BoxGeometry(2.6, 3.2, 12);
                const trainMat = new THREE.MeshLambertMaterial({ color: 0x1e90ff });
                const train = new THREE.Mesh(trainGeo, trainMat);
                train.position.set(x, 1.6, zPos);
                train.castShadow = true;
                scene.add(train);

                // Train Front Window
                const winGeo = new THREE.BoxGeometry(2.2, 1.0, 0.1);
                const winMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const win = new THREE.Mesh(winGeo, winMat);
                win.position.set(x, 2.2, zPos + 6.01);
                scene.add(win);
                train.userData = { win: win };

                obstacles.push(train);
            } else if (type < 0.75) {
                // High Hurdle (Duck under or Jump over)
                const barGeo = new THREE.BoxGeometry(2.8, 0.4, 0.4);
                const barMat = new THREE.MeshLambertMaterial({ color: 0xffa500 });
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.set(x, 1.2, zPos);

                const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.2, 0.2), barMat);
                leg1.position.set(x - 1.3, 0.6, zPos);
                const leg2 = leg1.clone();
                leg2.position.x = x + 1.3;

                scene.add(bar); scene.add(leg1); scene.add(leg2);
                bar.userData = { legs: [leg1, leg2] };
                obstacles.push(bar);
            } else {
                // Low Hurdle (Must Jump over)
                const hurdleGeo = new THREE.BoxGeometry(2.8, 0.8, 0.4);
                const hurdleMat = new THREE.MeshLambertMaterial({ color: 0xff4757 });
                const hurdle = new THREE.Mesh(hurdleGeo, hurdleMat);
                hurdle.position.set(x, 0.4, zPos);
                hurdle.castShadow = true;
                scene.add(hurdle);
                obstacles.push(hurdle);
            }

            // Spawn Coins on open lanes
            for (let l = 0; l < 3; l++) {
                if (l !== lane && Math.random() < 0.6) {
                    for (let c = 0; c < 4; c++) {
                        const coinGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 16);
                        const coinMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
                        const coin = new THREE.Mesh(coinGeo, coinMat);
                        coin.rotation.x = Math.PI / 2;
                        coin.position.set(LANES[l], 1.0, zPos - (c * 2.0));
                        scene.add(coin);
                        coinsList.push(coin);
                    }
                }
            }
        }

        // Initial obstacles setup
        for (let z = -30; z > -150; z -= 25) {
            spawnObstacleCluster(z);
        }

        // --- 7. INPUT HANDLING ---
        function moveLeft() {
            if (currentLane > 0) { currentLane--; targetX = LANES[currentLane]; }
        }
        function moveRight() {
            if (currentLane < 2) { currentLane++; targetX = LANES[currentLane]; }
        }
        function jump() {
            if (!isJumping) {
                initAudio();
                isJumping = true; yVelocity = 0.38;
                playSound('jump');
            }
        }
        function slide() {
            if (!isSliding) {
                initAudio();
                isSliding = true;
                playerGroup.scale.set(1, 0.5, 1);
                setTimeout(() => {
                    playerGroup.scale.set(1, 1, 1);
                    isSliding = false;
                }, 700);
            }
        }

        document.addEventListener('keydown', e => {
            if (isGameOver) return;
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
            if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
            if (e.code === 'ArrowUp' || e.code === 'KeyW') jump();
            if (e.code === 'ArrowDown' || e.code === 'KeyS') slide();
        });

        // Touch Buttons
        document.getElementById('t-left').onclick = moveLeft;
        document.getElementById('t-right').onclick = moveRight;
        document.getElementById('t-up').onclick = jump;
        document.getElementById('t-down').onclick = slide;

        // Touch Swipes
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });
        document.addEventListener('touchend', e => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) moveRight();
                else if (dx < -30) moveLeft();
            } else {
                if (dy < -30) jump();
                else if (dy > 30) slide();
            }
        });

        // --- 8. MAIN GAME LOOP ---
        function resetGame() {
            score = 0; coins = 0; gameSpeed = 0.4;
            currentLane = 1; targetX = LANES[1];
            playerGroup.position.set(0, 0, 0);
            isGameOver = false;

            document.getElementById('score').innerText = '0';
            document.getElementById('coins').innerText = '0';
            document.getElementById('game-over').classList.remove('active');

            // Clear obstacles and coins
            obstacles.forEach(o => {
                scene.remove(o);
                if (o.userData.win) scene.remove(o.userData.win);
                if (o.userData.legs) o.userData.legs.forEach(l => scene.remove(l));
            });
            coinsList.forEach(c => scene.remove(c));
            obstacles.length = 0;
            coinsList.length = 0;

            for (let z = -30; z > -150; z -= 25) {
                spawnObstacleCluster(z);
            }
        }

        document.getElementById('restart-btn').onclick = resetGame;

        function animate() {
            requestAnimationFrame(animate);

            if (isGameOver) return;

            // Score & Speed Scaling
            score += 1;
            gameSpeed += 0.00005;
            document.getElementById('score').innerText = Math.floor(score / 5);

            // Smooth Lateral Lane Movement
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2;

            // Physics (Jumping & Gravity)
            if (isJumping) {
                playerGroup.position.y += yVelocity;
                yVelocity += gravity;
                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    isJumping = false;
                }
            }

            // Move Track Segments
            segments.forEach(seg => {
                seg.position.z += gameSpeed;
                if (seg.position.z > 50) seg.position.z -= 150;
            });

            // Update Player Bounding Box
            playerBB.setFromObject(playerGroup);

            // Update Obstacles & Collision Check
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed;
                if (obs.userData.win) obs.userData.win.position.z += gameSpeed;
                if (obs.userData.legs) obs.userData.legs.forEach(l => l.position.z += gameSpeed);

                // Collision
                const obsBB = new THREE.Box3().setFromObject(obs);
                if (playerBB.intersectsBox(obsBB)) {
                    isGameOver = true;
                    playSound('crash');
                    document.getElementById('final-score').innerText = Math.floor(score / 5);
                    document.getElementById('final-coins').innerText = coins;
                    document.getElementById('game-over').classList.add('active');
                }

                // Recycle Obstacle
                if (obs.position.z > 15) {
                    scene.remove(obs);
                    if (obs.userData.win) scene.remove(obs.userData.win);
                    if (obs.userData.legs) obs.userData.legs.forEach(l => scene.remove(l));
                    obstacles.splice(i, 1);
                    spawnObstacleCluster(-135);
                }
            }

            // Update Coins & Collection Check
            for (let i = coinsList.length - 1; i >= 0; i--) {
                const coin = coinsList[i];
                coin.position.z += gameSpeed;
                coin.rotation.z += 0.05;

                const coinBB = new THREE.Box3().setFromObject(coin);
                if (playerBB.intersectsBox(coinBB)) {
                    coins++;
                    playSound('coin');
                    document.getElementById('coins').innerText = coins;
                    scene.remove(coin);
                    coinsList.splice(i, 1);
                    continue;
                }

                if (coin.position.z > 15) {
                    scene.remove(coin);
                    coinsList.splice(i, 1);
                }
            }

            // Camera follow pitch tilt
            camera.position.x = playerGroup.position.x * 0.3;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
